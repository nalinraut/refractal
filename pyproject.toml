[project]
name = "refractal"
version = "0.1.0a1"
description = "Scene-coherent placement and paired comparison for policy evaluation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nalin Raut" }]
keywords = [
    "robotics", "evaluation", "vla", "reproducibility", "benchmark",
    "statistics", "simulation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/nalinraut/refractal"
Repository = "https://github.com/nalinraut/refractal"
Issues = "https://github.com/nalinraut/refractal/issues"

[project.scripts]
refractal = "refractal.cli:main"

[project.optional-dependencies]
# refractal.execute only. Nothing in schema/ or resolve/ may depend on these --
# `refractal plan` has to run on a machine with none of them installed, and
# tests/test_boundaries.py fails the build if that stops being true.
execute = ["fsspec>=2024.2.0", "pyarrow>=15.0"]
# refractal.compare only. Note the absence of scipy: exact McNemar is a binomial
# tail, the bootstrap is resampling, and Cochran's Q is a permutation test.
compare = ["pyarrow>=15.0", "fsspec>=2024.2.0"]
# The vla-eval bridge. >=0.6.0 because that release is the first to carry both
# fixes Refractal depends on -- dc2c4ba (observation-param forwarding through the
# MRO) and 0865d42 (the shard collision). Before it, getting those meant a git
# ref, which cannot appear in metadata uploaded to PyPI; now it is an ordinary
# specifier and the Dockerfile does not need to pin a commit.
vla-eval = ["vla-eval>=0.6.0", "fsspec>=2024.2.0", "pyarrow>=15.0"]
# Frame recording, and optional on purpose. `run --video` encodes one WebP
# sprite strip per episode; a run without it needs none of this, and the import
# is lazy behind an error that names the fix. Declared because "optional" and
# "undeclared" are different things -- it was the second, and CI found out by
# failing four tests with ModuleNotFoundError.
video = ["pillow>=10.0"]
# What the test suite needs beyond the runtime extras. numpy is here rather than
# in `execute` because Refractal does not import it: the harness hands arrays in
# and they pass straight through to Pillow. The tests have to fabricate those
# arrays, so the dependency is theirs.
test = ["pillow>=10.0", "numpy>=1.24"]
# Everything, for a machine that runs the whole pipeline.
all = ["fsspec>=2024.2.0", "pyarrow>=15.0", "pillow>=10.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refractal"]

[tool.hatch.build.targets.sdist]
include = ["src/refractal", "tests", "examples", "docs", "README.md", "LICENSE"]
