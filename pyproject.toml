[project]
name = "refractal"
version = "0.1.0.dev0"
description = "Scene-coherent placement and paired comparison for policy evaluation"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.scripts]
refractal = "refractal.cli:main"

[project.optional-dependencies]
# refractal.execute only. Nothing in schema/ or resolve/ may depend on these.
execute = ["fsspec>=2024.2.0", "pyarrow>=15.0"]
# refractal.compare only.
compare = ["duckdb>=0.10", "scipy>=1.12", "pyarrow>=15.0", "fsspec>=2024.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/refractal"]
