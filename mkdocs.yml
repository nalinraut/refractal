site_name: Refractal
site_description: Paired comparison of policy checkpoints over content-addressed episodes.
docs_dir: docs

# The readthedocs theme ships with MkDocs, so building the docs needs no
# dependency beyond mkdocs itself. Its left sidebar is permanently docked.
theme:
  name: readthedocs
  highlightjs: true
  # highlight.js bundles about 23 common languages, which already include yaml
  # and python. `dockerfile` is not among them and is listed here. `console` is
  # not a highlight.js language at all; those blocks render unhighlighted, which
  # is correct for a transcript of commands and their output.
  hljs_languages:
    - dockerfile
  navigation_depth: 3

# The sidebar order is the reading order. A document not listed here is still
# built but never appears in the nav, so add it here when you add it to docs/.
nav:
  - Refractal: README.md
  - Getting started: getting-started.md
  - Using it:
      - Writing a catalog: writing-a-catalog.md
      - Catalog reference: catalog-reference.md
      - Reading a comparison: reading-a-comparison.md
      - Execution modes: execution-mode.md
  - Connecting a simulator:
      - Adapter contract: adapter-contract.md
      - Adapter example: adapter-example.md
  - Perturbations:
      - What and why: perturbations/index.md
      - Declaring: perturbations/declaring.md
      - Adapters: perturbations/adapters.md
      - Sweeps: perturbations/sweeps.md
  - Running at scale:
      - Against vla-eval: backend-vla-eval.md
      - In containers: backend-compose.md
  - Releasing: releasing.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}

# A dead cross-link fails the build rather than shipping. The docs have been
# renamed once already; this is what stops the next time shipping broken.
strict: true
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
