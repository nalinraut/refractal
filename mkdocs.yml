site_name: Refractal
site_description: Paired comparison of policy checkpoints over content-addressed episodes.
docs_dir: docs

theme:
  name: material
  features:
    # A single docked sidebar on the left, always visible, always expanded.
    # `toc.integrate` folds each page's headings into it rather than putting a
    # second column on the right, so there is one place to look.
    - navigation.sections
    - navigation.expand
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - toc.integrate
    - toc.follow
    - content.code.copy
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

# The sidebar order is the reading order. Anything not listed here is still
# built but does not appear in the nav, which is how a new document goes
# unnoticed -- add it here when you add it to docs/.
nav:
  - Refractal: README.md
  - Getting started: getting-started.md
  - Using it:
      - Writing a catalog: writing-a-catalog.md
      - Reading a comparison: reading-a-comparison.md
      - Execution modes: execution-mode.md
  - Connecting a simulator:
      - Adapter contract: adapter-contract.md
      - Adapter example: adapter-example.md
  - Running at scale:
      - Against vla-eval: backend-vla-eval.md
      - In containers: backend-compose.md
  - Releasing: releasing.md

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.superfences
  - pymdownx.inlinehilite

# A dead cross-link should fail the build rather than ship. The docs have been
# renamed twice; this is what stops the third time shipping broken.
strict: true
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn
